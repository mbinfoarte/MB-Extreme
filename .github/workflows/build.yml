name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # assinatura de código só acontece se o certificado estiver nos segredos do repositório (SIGN_PFX_BASE64 e SIGN_PFX_PASSWORD)
      HAS_CERT: ${{ secrets.SIGN_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Testes
        run: dotnet test tests/MBExtreme.Core.Tests/MBExtreme.Core.Tests.csproj -c Release

      - name: Testes do servidor de licenças
        run: dotnet test tests/MBExtreme.LicenseServer.Tests/MBExtreme.LicenseServer.Tests.csproj -c Release

      - name: Gerar o índice de hardware (Blender Open Data, CC0)
        continue-on-error: true
        run: dotnet run --project tools/MBExtreme.IndexTool/MBExtreme.IndexTool.csproj -c Release -- --download src/MBExtreme.App/Assets/hardware-index.json

      - name: Publicar app (Windows x64)
        run: dotnet publish src/MBExtreme.App/MBExtreme.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true "-p:Version=0.9.${{ github.run_number }}" -o out

      - name: Assinar o aplicativo
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:PFX_BASE64))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          & $signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 out\MBExtreme.exe
          if ($LASTEXITCODE -ne 0) { throw "Falha ao assinar o aplicativo" }

      # o motor de vídeo (FFmpeg) vai junto com o programa: o usuário não instala nada. Se o download falhar, o programa baixa sozinho na primeira vez.
      - name: Motor de vídeo junto com o programa
        continue-on-error: true
        shell: pwsh
        run: |
          $base = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Invoke-WebRequest $base -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest "$base.sha256" -OutFile "$env:RUNNER_TEMP\ffmpeg.sha256"
          $expected = ((Get-Content "$env:RUNNER_TEMP\ffmpeg.sha256" -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash "$env:RUNNER_TEMP\ffmpeg.zip" -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "O FFmpeg baixado nao confere com o SHA-256 publicado" }
          Expand-Archive "$env:RUNNER_TEMP\ffmpeg.zip" "$env:RUNNER_TEMP\ffmpeg"
          New-Item -ItemType Directory -Force out\ffmpeg | Out-Null
          Copy-Item (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName out\ffmpeg\ffmpeg.exe
          $license = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter LICENSE* | Select-Object -First 1
          if ($license) { Copy-Item $license.FullName out\ffmpeg\LICENSE.txt }
          & out\ffmpeg\ffmpeg.exe -hide_banner -encoders | Select-String "nvenc|amf|qsv"

      - name: Compactar o aplicativo
        run: |
          Remove-Item out\*.pdb -ErrorAction SilentlyContinue
          Compress-Archive -Path out\* -DestinationPath payload.zip
          Copy-Item payload.zip MBExtreme-Beta-portatil-win-x64.zip

      - name: Gerar o instalador (.exe)
        run: dotnet publish src/MBExtreme.Installer/MBExtreme.Installer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true "-p:Version=0.9.${{ github.run_number }}" "-p:PayloadZip=${{ github.workspace }}\payload.zip" -o setup

      - name: Assinar o instalador
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          & $signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 setup\MBExtreme-Beta-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw "Falha ao assinar o instalador" }

      # cópia extra do instalador nas Actions: o lançamento (abaixo) já publica os arquivos,
      # então, se o espaço de artefatos do GitHub encher, a compilação segue mesmo assim
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: MBExtreme-Beta-instalador
          path: setup/MBExtreme-Beta-Setup.exe
          retention-days: 1

      - name: Publicar o MB Extreme (Beta 01)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "beta-${{ github.run_number }}" setup/MBExtreme-Beta-Setup.exe MBExtreme-Beta-portatil-win-x64.zip
          --prerelease
          --target "${{ github.sha }}"
          --title "MB Extreme (Beta 01) - compilação ${{ github.run_number }}"
          --notes "MB Extreme (Beta 01), compilação ${{ github.run_number }} (commit ${{ github.sha }}). Baixe MBExtreme-Beta-Setup.exe para instalar (pede permissão de administrador). MBExtreme-Beta-portatil-win-x64.zip é a versão sem instalação. Crie um ponto de restauração do Windows antes de aplicar ajustes."

      - name: Avisar o servidor da nova versão (atualização dentro do programa)
        continue-on-error: true
        shell: pwsh
        env:
          UPDATE_URL: ${{ vars.MBX_SERVER_URL }}
          UPDATE_TOKEN: ${{ secrets.MBX_UPDATE_TOKEN }}
          DOWNLOAD_BASE: ${{ vars.MBX_DOWNLOAD_BASE }}
        run: |
          if (-not $env:UPDATE_URL -or -not $env:UPDATE_TOKEN) { Write-Host "Servidor de atualizacao nao configurado; pulando."; exit 0 }
          $setup = "setup\MBExtreme-Beta-Setup.exe"
          $sha = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          $base = if ($env:DOWNLOAD_BASE) { $env:DOWNLOAD_BASE.TrimEnd('/') } else { "https://github.com/${{ github.repository }}/releases/download/beta-${{ github.run_number }}" }
          $manifest = @{ build = [int]"${{ github.run_number }}"; version = "0.9.${{ github.run_number }}"; url = "$base/MBExtreme-Beta-Setup.exe"; sha256 = $sha; size = (Get-Item $setup).Length; notes = "Nova compilação do MB Extreme."; minimumBuild = 0 } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri "$($env:UPDATE_URL.TrimEnd('/'))/v1/admin/app/latest" -Headers @{ Authorization = "Bearer $env:UPDATE_TOKEN" } -ContentType "application/json" -Body $manifest

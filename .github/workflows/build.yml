name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Testes
        run: dotnet test tests/MBExtreme.Core.Tests/MBExtreme.Core.Tests.csproj -c Release

      - name: Publicar app (Windows x64)
        run: dotnet publish src/MBExtreme.App/MBExtreme.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o out

      - name: Compactar o aplicativo
        run: |
          Remove-Item out\*.pdb -ErrorAction SilentlyContinue
          Compress-Archive -Path out\* -DestinationPath payload.zip
          Copy-Item payload.zip MBExtreme-Beta-portatil-win-x64.zip

      - name: Gerar o instalador (.exe)
        run: dotnet publish src/MBExtreme.Installer/MBExtreme.Installer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true "-p:PayloadZip=${{ github.workspace }}\payload.zip" -o setup

      - uses: actions/upload-artifact@v4
        with:
          name: MBExtreme-Beta-instalador
          path: setup/MBExtreme-Beta-Setup.exe

      - name: Publicar o MB Extreme (Beta 01)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "beta-${{ github.run_number }}" setup/MBExtreme-Beta-Setup.exe MBExtreme-Beta-portatil-win-x64.zip
          --prerelease
          --target "${{ github.sha }}"
          --title "MB Extreme (Beta 01) - compilação ${{ github.run_number }}"
          --notes "MB Extreme (Beta 01), compilação ${{ github.run_number }} (commit ${{ github.sha }}). Baixe MBExtreme-Beta-Setup.exe para instalar (pede permissão de administrador). MBExtreme-Beta-portatil-win-x64.zip é a versão sem instalação. Crie um ponto de restauração do Windows antes de aplicar ajustes."

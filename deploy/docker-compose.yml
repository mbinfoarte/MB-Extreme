# Site + HTTPS automático (Caddy). Copie deploy/.env.example para deploy/.env, preencha e rode:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  app:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    environment:
      Site__BaseUrl: https://${DOMAIN}
      Site__SupportEmail: ${SUPPORT_EMAIL}
      Download__SetupUrl: ${DOWNLOAD_SETUP_URL}
      Download__PortableUrl: ${DOWNLOAD_PORTABLE_URL}
      Download__Version: ${APP_VERSION:-Beta 01}
      Google__ClientId: ${GOOGLE_CLIENT_ID}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET}
      Stripe__Prices__monthly: ${STRIPE_PRICE_MONTHLY}
      Stripe__Prices__quarterly: ${STRIPE_PRICE_QUARTERLY}
      Stripe__Prices__semiannual: ${STRIPE_PRICE_SEMIANNUAL}
      Stripe__Prices__annual: ${STRIPE_PRICE_ANNUAL}
      Admin__Emails: ${ADMIN_EMAILS}
      Billing__TrialDays: ${TRIAL_DAYS:-3}
    volumes: [ "appdata:/data" ]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: [ "80:80", "443:443" ]
    environment: { DOMAIN: "${DOMAIN}" }
    volumes: [ "./Caddyfile:/etc/caddy/Caddyfile:ro", "caddydata:/data" ]
    depends_on: [ app ]
volumes: { appdata: {}, caddydata: {} }
